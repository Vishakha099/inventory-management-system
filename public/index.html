<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockroom – Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --panel:#FFFFFF; --ink:#1B2B2F; --muted:#5E6F72; --line:#D3DAD6;
  --accent:#1F6F63; --accent-ink:#FFFFFF; --warn:#B86E00; --warn-bg:#FFF1D6;
  --danger:#B3362B; --danger-bg:#FBE4E1; --head:#E3E9E5;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141C1E;--panel:#1D282B;--ink:#E6EEEA;--muted:#93A5A6;--line:#32423F;
  --accent:#4DB6A5;--accent-ink:#0E1A18;--warn:#F0B14A;--warn-bg:#3A2D12;
  --danger:#F08A80;--danger-bg:#3D1F1C;--head:#243236}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'Public Sans',system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);margin:2px 0 0}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.stat b{display:block;font-size:24px;font-weight:700}
.stat span{color:var(--muted);font-size:13px}
.stat.alert b{color:var(--warn)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{flex:1 1 220px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.tools select{flex:0 1 200px}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
th{background:var(--head);font-weight:500;font-size:13px;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500}
.badge.low{background:var(--warn-bg);color:var(--warn)}
.badge.out{background:var(--danger-bg);color:var(--danger)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.acts button{padding:4px 10px;font-size:13px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--panel);color:var(--ink);width:min(460px,92vw)}
dialog::backdrop{background:rgba(10,20,20,.5)}
form{padding:22px;display:grid;gap:14px}
form h2{margin:0;font-size:20px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label input{padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formacts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.msg{color:var(--danger);font-size:14px;min-height:20px;margin:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Stockroom</h1>
      <p class="sub">Everything on the shelf, and what needs reordering.</p>
    </div>
    <button class="primary" id="addBtn">Add item</button>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="stat"><b id="sItems">0</b><span>Items</span></div>
    <div class="stat"><b id="sUnits">0</b><span>Units in stock</span></div>
    <div class="stat"><b id="sValue">0</b><span>Stock value</span></div>
    <div class="stat alert"><b id="sLow">0</b><span>Need reordering</span></div>
  </section>

  <div class="tools">
    <input id="search" type="search" placeholder="Search by name, SKU or category" aria-label="Search items">
    <select id="filter" aria-label="Filter by stock level">
      <option value="all">All stock levels</option>
      <option value="low">Low stock</option>
      <option value="out">Out of stock</option>
    </select>
  </div>

  <div class="tablebox">
    <table>
      <thead><tr>
        <th>Name</th><th>SKU</th><th>Category</th>
        <th class="num">Qty</th><th class="num">Price</th><th>Status</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Add item</h2>
    <label>Name<input name="name" required></label>
    <div class="row">
      <label>SKU<input name="sku" required></label>
      <label>Category<input name="category"></label>
    </div>
    <div class="row">
      <label>Quantity<input name="quantity" type="number" min="0" step="1" required value="0"></label>
      <label>Reorder at<input name="reorderAt" type="number" min="0" step="1" value="5"></label>
    </div>
    <label>Price<input name="price" type="number" min="0" step="0.01" value="0"></label>
    <p class="msg" id="formMsg" role="alert"></p>
    <div class="formacts">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="saveBtn">Save item</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const API = '/api/items';   // same server serves page and API
let items = [], editingId = null;
const $ = id => document.getElementById(id);
const money = n => (n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }

async function api(url, opts){
  const res = await fetch(url, { headers:{'Content-Type':'application/json'}, ...opts });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

const status = i => i.quantity === 0 ? 'out' : i.quantity <= i.reorderAt ? 'low' : 'ok';

async function load(){
  try { items = await api(API); render(); }
  catch(e){ $('rows').innerHTML=''; showEmpty('Cannot reach the server. Check that it is running and MongoDB is connected.'); }
}

function showEmpty(text){ $('empty').textContent = text; $('empty').hidden = false; }

function render(){
  const q = $('search').value.trim().toLowerCase(), f = $('filter').value;
  const list = items.filter(i =>
    (!q || [i.name,i.sku,i.category].some(v => (v||'').toLowerCase().includes(q))) &&
    (f==='all' || status(i)===f));

  $('rows').innerHTML = list.map(i => {
    const s = status(i);
    const badge = s==='out' ? '<span class="badge out">Out of stock</span>'
                : s==='low' ? '<span class="badge low">Low stock</span>' : 'In stock';
    return `<tr>
      <td>${esc(i.name)}</td><td>${esc(i.sku)}</td><td>${esc(i.category)}</td>
      <td class="num">${i.quantity}</td><td class="num">${money(i.price)}</td><td>${badge}</td>
      <td><div class="acts">
        <button data-edit="${i._id}">Edit</button>
        <button class="danger" data-del="${i._id}">Delete</button>
      </div></td></tr>`;
  }).join('');

  if (list.length) $('empty').hidden = true;
  else showEmpty(items.length ? 'No items match your search.' : 'No items yet. Select Add item to create the first one.');

  $('sItems').textContent = items.length;
  $('sUnits').textContent = items.reduce((a,i)=>a+i.quantity,0);
  $('sValue').textContent = money(items.reduce((a,i)=>a+i.quantity*(i.price||0),0));
  $('sLow').textContent = items.filter(i => status(i)!=='ok').length;
}

function openForm(item){
  editingId = item ? item._id : null;
  $('dlgTitle').textContent = item ? 'Edit item' : 'Add item';
  $('formMsg').textContent = '';
  const f = $('form');
  f.name.value = item?.name ?? ''; f.sku.value = item?.sku ?? '';
  f.category.value = item?.category ?? ''; f.quantity.value = item?.quantity ?? 0;
  f.reorderAt.value = item?.reorderAt ?? 5; f.price.value = item?.price ?? 0;
  $('dlg').showModal();
}

$('addBtn').onclick = () => openForm();
$('cancel').onclick = () => $('dlg').close();
$('search').oninput = render;
$('filter').onchange = render;

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const body = JSON.stringify({
    name: f.name.value, sku: f.sku.value, category: f.category.value,
    quantity: +f.quantity.value, reorderAt: +f.reorderAt.value, price: +f.price.value
  });
  $('saveBtn').disabled = true;
  try {
    if (editingId) await api(`${API}/${editingId}`, { method:'PUT', body });
    else await api(API, { method:'POST', body });
    $('dlg').close(); toast(editingId ? 'Item updated' : 'Item added'); await load();
  } catch(err){ $('formMsg').textContent = err.message; }
  finally { $('saveBtn').disabled = false; }
});

$('rows').addEventListener('click', async e => {
  const edit = e.target.dataset.edit, del = e.target.dataset.del;
  if (edit) openForm(items.find(i => i._id === edit));
  if (del && confirm('Delete this item? This cannot be undone.')) {
    try { await api(`${API}/${del}`, { method:'DELETE' }); toast('Item deleted'); await load(); }
    catch(err){ toast(err.message); }
  }
});

load();
</script>
</body>
</html>
